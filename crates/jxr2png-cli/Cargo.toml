[package]
name = "jxr2png"
description = "Command-line JXR to PNG converter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
rayon = "1.12.0"
wild = "2"
jxr2png-core = { version = "1.1.0", path = "../jxr2png-core" }
