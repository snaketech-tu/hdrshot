[package]
name = "hdrshot"
description = "HDR image tool: convert HDR screenshots (JXR, EXR, JXL, HDR PNG) to HDR PNG, AVIF, Ultra HDR JPEG and SDR PNG"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
ctrlc = "3.5.2"
rayon = "1.12.0"
wild = "2"
hdrshot-core = { version = "2.0.1", path = "../hdrshot-core" }
