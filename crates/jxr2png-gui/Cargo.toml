[package]
name = "jxr2png-gui"
description = "Desktop JXR to PNG converter"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
eframe = { version = "0.37.0", features = ["persistence"] }
jxr2png-core = { version = "0.1.0", path = "../jxr2png-core" }
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
winreg = "0.56.0"

[build-dependencies]
winresource = "0.1.34"
