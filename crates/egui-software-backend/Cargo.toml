[package]
name = "hdrshot-egui-backend"
description = "CPU renderer for egui (vendored from egui_software_backend 0.0.3, ported to egui 0.37)"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/snaketech-tu/hdrshot"
readme = "README.md"

[lib]
name = "egui_software_backend"
# The crate docs show examples that need egui_demo_lib.
doctest = false

[dependencies]
ahash = { version = "0.8", default-features = false, features = ["no-rng", "std"] }
constify = "0.0.1"
egui = { version = "0.37.0", default-features = false }
strength_reduce = "0.2.4"

[features]
default = ["std"]
std = []
