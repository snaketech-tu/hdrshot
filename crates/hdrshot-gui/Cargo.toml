[package]
name = "hdrshot-gui"
description = "HDR image tool: desktop app for converting HDR screenshots and images"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["multimedia::images", "gui"]
readme = "../../README.md"

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
bytemuck = "1.25.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-winit = "0.37.0"
hdrshot-egui-backend = { version = "0.1.0", path = "../egui-software-backend" }
egui_system_font_provider = "0.37.0"
interprocess = "2.4.6"
hdrshot-core = { version = "2.0.0", path = "../hdrshot-core" }
png = "0.18.1"
rfd = "0.17.2"
ron = "0.12.2"
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4"
ureq = { version = "3.4.2", default-features = false, features = ["json", "platform-verifier", "rustls"] }
winit = "0.30.13"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }

[build-dependencies]
winresource = "0.1.34"
