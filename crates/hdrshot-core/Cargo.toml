[package]
name = "hdrshot-core"
description = "Library behind hdrshot: decode HDR images and encode HDR PNG, AVIF, Ultra HDR JPEG and tone-mapped SDR PNG"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["multimedia::images", "multimedia::encoding"]
readme = "README.md"

[dependencies]
avif-serialize = "0.8"
exr = "1.74"
image = { version = "0.25", default-features = false, features = ["hdr"] }
jpeg-encoder = "0.7"
jxl-oxide = { version = "0.12", features = ["moxcms"] }
heic-decoder = "0.1.1"
jxr = "0.3"
notify = "8"
png = "0.18"
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
rayon = "1.12.0"
thiserror = "2.0.21"
zune-core = "0.5"
zune-jpeg = "0.5.15"

[dev-dependencies]
jpeg-decoder = "0.3"
