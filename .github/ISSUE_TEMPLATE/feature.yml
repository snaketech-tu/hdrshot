name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe what you are trying to achieve. The situation matters more than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could hdrshot help?
      description: Optional. Your idea for how it could work.
  - type: dropdown
    id: surface
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app
        - Command line
        - Browser version
