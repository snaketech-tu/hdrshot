name: Release

# Pushing a tag such as v1.0.0 builds the CLI and desktop app for Windows,
# macOS and Linux and publishes them as a GitHub release. The release notes
# are that version's section of CHANGELOG.md. Pull requests that change this
# workflow run the builds without publishing anything.
#
# Each platform gets a separate download for the desktop app and for the CLI.
# File names carry no version, so releases/latest/download/<name> always
# points at the newest build:
#   jxr2png-gui.exe, jxr2png.exe          Windows, ready to run
#   jxr2png-gui-macos.dmg                 macOS app, drag to Applications
#   jxr2png-cli-macos.tar.gz              macOS CLI, completions, man page
#   jxr2png-gui-linux-x64.tar.gz          Linux app, .desktop file, icon
#   jxr2png-cli-linux-x64.tar.gz          Linux CLI, completions, man page
#   SHA256SUMS.txt
# The tarballs keep the executable bit, which a bare binary loses when a
# browser downloads it.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on the selected branch if missing)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'dev' || github.ref_name) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          # The oldest supported runner, so the binaries run on older glibc.
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Link the C runtime statically so no Visual C++ redistributable is needed.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --workspace
          mkdir out
          cp target/release/jxr2png.exe target/release/jxr2png-gui.exe out/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --workspace --target "$target"
          done
          cli=jxr2png-cli-macos
          gui="$RUNNER_TEMP/gui"
          app="$gui/jxr2png.app/Contents"
          mkdir -p out "$cli" "$app/MacOS" "$app/Resources"
          for bin in jxr2png jxr2png-gui; do
            lipo -create -output "target/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done
          cp target/jxr2png README.md LICENSE "$cli/"
          mkdir "$cli/completions" "$cli/man"
          target/jxr2png --generate bash > "$cli/completions/jxr2png.bash"
          target/jxr2png --generate zsh > "$cli/completions/_jxr2png"
          target/jxr2png --generate fish > "$cli/completions/jxr2png.fish"
          target/jxr2png --generate man > "$cli/man/jxr2png.1"
          cp target/jxr2png-gui "$app/MacOS/"
          iconset="$RUNNER_TEMP/jxr2png.iconset"
          mkdir "$iconset"
          for size in 16 32 64 128 256; do
            sips -z $size $size crates/jxr2png-gui/assets/icon.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
          done
          for size in 16 32 64 128; do
            cp "$iconset/icon_$((size * 2))x$((size * 2)).png" "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Resources/jxr2png.icns"
          version="${TAG#v}"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>jxr2png</string>
            <key>CFBundleDisplayName</key><string>jxr2png</string>
            <key>CFBundleIdentifier</key><string>io.github.snaketech-tu.jxr2png</string>
            <key>CFBundleExecutable</key><string>jxr2png-gui</string>
            <key>CFBundleIconFile</key><string>jxr2png</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>JPEG XR image</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array><string>io.github.snaketech-tu.jxr2png.jxr</string></array>
                <key>CFBundleTypeExtensions</key>
                <array><string>jxr</string><string>wdp</string></array>
              </dict>
            </array>
            <key>UTImportedTypeDeclarations</key>
            <array>
              <dict>
                <key>UTTypeIdentifier</key><string>io.github.snaketech-tu.jxr2png.jxr</string>
                <key>UTTypeDescription</key><string>JPEG XR image</string>
                <key>UTTypeConformsTo</key>
                <array><string>public.image</string><string>public.data</string></array>
                <key>UTTypeTagSpecification</key>
                <dict>
                  <key>public.filename-extension</key>
                  <array><string>jxr</string><string>wdp</string></array>
                  <key>public.mime-type</key><string>image/vnd.ms-photo</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required for Apple silicon, not a notarization.
          codesign --force --deep --sign - "$gui/jxr2png.app" "$cli/jxr2png"
          tar -czf "out/$cli.tar.gz" "$cli"
          # The disk image shows the app next to a link to Applications.
          ln -s /Applications "$gui/Applications"
          # hdiutil now and then fails with "Resource busy" on CI runners.
          for attempt in 1 2 3; do
            hdiutil create -volname jxr2png -srcfolder "$gui" -fs HFS+ \
              -format UDZO -ov out/jxr2png-gui-macos.dmg && break
            test $attempt -lt 3 && sleep 5
          done
          test -f out/jxr2png-gui-macos.dmg

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --workspace
          cli=jxr2png-cli-linux-x64
          gui=jxr2png-gui-linux-x64
          mkdir out "$cli" "$gui"
          cp target/release/jxr2png README.md LICENSE "$cli/"
          mkdir "$cli/completions" "$cli/man"
          target/release/jxr2png --generate bash > "$cli/completions/jxr2png.bash"
          target/release/jxr2png --generate zsh > "$cli/completions/_jxr2png"
          target/release/jxr2png --generate fish > "$cli/completions/jxr2png.fish"
          target/release/jxr2png --generate man > "$cli/man/jxr2png.1"
          cp target/release/jxr2png-gui README.md LICENSE packaging/linux/jxr2png.desktop "$gui/"
          cp crates/jxr2png-gui/assets/icon.png "$gui/jxr2png.png"
          tar -czf "out/$cli.tar.gz" "$cli"
          tar -czf "out/$gui.tar.gz" "$gui"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # On pull requests this job checks the combined downloads and stops before
  # publishing.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'pull_request'
        run: |
          awk -v v="${TAG#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: jxr2png ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
