name: Release

# Pushing a tag such as v1.0.0 builds the CLI and desktop app for Windows,
# macOS and Linux and publishes them as a GitHub release. The release notes
# are that version's section of CHANGELOG.md. Pull requests that change this
# workflow run the builds without publishing anything.
#
# Each platform gets a separate download for the desktop app and for the CLI.
# File names carry no version, so releases/latest/download/<name> always
# points at the newest build:
#   hdrshot.exe, hdrshot-cli.exe          Windows app and CLI, ready to run
#   hdrshot-gui.exe                       the Windows app again, for the
#                                         Update button of 2.1.0 and older
#   hdrshot-gui-macos.dmg                 macOS app, drag to Applications
#   hdrshot-cli-macos.tar.gz              macOS CLI, completions, man page
#   hdrshot-gui-linux-x64.tar.gz          Linux app, .desktop file, icon
#   hdrshot-cli-linux-x64.tar.gz          Linux CLI, completions, man page
#   SHA256SUMS.txt
# The tarballs keep the executable bit, which a bare binary loses when a
# browser downloads it.
#
# After the GitHub release, the crates are published to crates.io through
# Trusted Publishing (no stored token) and the winget packages are updated.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v1.0.0 (created on the selected branch if missing)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || (github.event_name == 'pull_request' && 'dev' || github.ref_name) }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
          - name: macos-universal
            os: macos-latest
          # The oldest supported runner, so the binaries run on older glibc.
          - name: linux-x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # Link the C runtime statically so no Visual C++ redistributable is needed.
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --workspace
          mkdir out
          # Windows users expect hdrshot.exe to be the app. Versions up to
          # 2.1.0 update themselves from hdrshot-gui.exe, so it is there too.
          cp target/release/hdrshot-gui.exe out/hdrshot.exe
          cp target/release/hdrshot.exe out/hdrshot-cli.exe
          cp target/release/hdrshot-gui.exe out/

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --workspace --target "$target"
          done
          cli=hdrshot-cli-macos
          gui="$RUNNER_TEMP/gui"
          app="$gui/hdrshot.app/Contents"
          mkdir -p out "$cli" "$app/MacOS" "$app/Resources"
          for bin in hdrshot hdrshot-gui; do
            lipo -create -output "target/$bin" \
              "target/aarch64-apple-darwin/release/$bin" \
              "target/x86_64-apple-darwin/release/$bin"
          done
          cp target/hdrshot README.md LICENSE "$cli/"
          mkdir "$cli/completions" "$cli/man"
          target/hdrshot --generate bash > "$cli/completions/hdrshot.bash"
          target/hdrshot --generate zsh > "$cli/completions/_hdrshot"
          target/hdrshot --generate fish > "$cli/completions/hdrshot.fish"
          target/hdrshot --generate man > "$cli/man/hdrshot.1"
          cp target/hdrshot-gui "$app/MacOS/"
          cp packaging/macos/hdrshot.icns "$app/Resources/"
          version="${TAG#v}"
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>hdrshot</string>
            <key>CFBundleDisplayName</key><string>hdrshot</string>
            <key>CFBundleIdentifier</key><string>io.github.snaketech-tu.hdrshot</string>
            <key>CFBundleExecutable</key><string>hdrshot-gui</string>
            <key>CFBundleIconFile</key><string>hdrshot</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key>
            <array>
              <dict>
                <key>CFBundleTypeName</key><string>JPEG XR image</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array><string>io.github.snaketech-tu.hdrshot.jxr</string></array>
                <key>CFBundleTypeExtensions</key>
                <array><string>jxr</string><string>wdp</string></array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key><string>OpenEXR image</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array><string>com.ilm.openexr-image</string></array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key><string>JPEG XL image</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array><string>public.jpeg-xl</string></array>
              </dict>
              <dict>
                <key>CFBundleTypeName</key><string>Radiance HDR image</string>
                <key>CFBundleTypeRole</key><string>Viewer</string>
                <key>LSHandlerRank</key><string>Alternate</string>
                <key>LSItemContentTypes</key>
                <array><string>public.radiance</string></array>
              </dict>
            </array>
            <key>UTImportedTypeDeclarations</key>
            <array>
              <dict>
                <key>UTTypeIdentifier</key><string>io.github.snaketech-tu.hdrshot.jxr</string>
                <key>UTTypeDescription</key><string>JPEG XR image</string>
                <key>UTTypeConformsTo</key>
                <array><string>public.image</string><string>public.data</string></array>
                <key>UTTypeTagSpecification</key>
                <dict>
                  <key>public.filename-extension</key>
                  <array><string>jxr</string><string>wdp</string></array>
                  <key>public.mime-type</key><string>image/vnd.ms-photo</string>
                </dict>
              </dict>
              <!-- System types, declared here too for macOS versions that
                   don't know them yet (JPEG XL came with macOS 14). -->
              <dict>
                <key>UTTypeIdentifier</key><string>com.ilm.openexr-image</string>
                <key>UTTypeDescription</key><string>OpenEXR image</string>
                <key>UTTypeConformsTo</key>
                <array><string>public.image</string><string>public.data</string></array>
                <key>UTTypeTagSpecification</key>
                <dict>
                  <key>public.filename-extension</key>
                  <array><string>exr</string></array>
                  <key>public.mime-type</key><string>image/x-exr</string>
                </dict>
              </dict>
              <dict>
                <key>UTTypeIdentifier</key><string>public.jpeg-xl</string>
                <key>UTTypeDescription</key><string>JPEG XL image</string>
                <key>UTTypeConformsTo</key>
                <array><string>public.image</string><string>public.data</string></array>
                <key>UTTypeTagSpecification</key>
                <dict>
                  <key>public.filename-extension</key>
                  <array><string>jxl</string></array>
                  <key>public.mime-type</key><string>image/jxl</string>
                </dict>
              </dict>
              <dict>
                <key>UTTypeIdentifier</key><string>public.radiance</string>
                <key>UTTypeDescription</key><string>Radiance HDR image</string>
                <key>UTTypeConformsTo</key>
                <array><string>public.image</string><string>public.data</string></array>
                <key>UTTypeTagSpecification</key>
                <dict>
                  <key>public.filename-extension</key>
                  <array><string>hdr</string></array>
                  <key>public.mime-type</key><string>image/vnd.radiance</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature: required for Apple silicon, not a notarization.
          codesign --force --deep --sign - "$gui/hdrshot.app" "$cli/hdrshot"
          tar -czf "out/$cli.tar.gz" "$cli"
          # The disk image shows the app next to a link to Applications.
          ln -s /Applications "$gui/Applications"
          # hdiutil now and then fails with "Resource busy" on CI runners.
          for attempt in 1 2 3; do
            hdiutil create -volname hdrshot -srcfolder "$gui" -fs HFS+ \
              -format UDZO -ov out/hdrshot-gui-macos.dmg && break
            test $attempt -lt 3 && sleep 5
          done
          test -f out/hdrshot-gui-macos.dmg

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked --workspace
          cli=hdrshot-cli-linux-x64
          gui=hdrshot-gui-linux-x64
          mkdir out "$cli" "$gui"
          cp target/release/hdrshot README.md LICENSE "$cli/"
          mkdir "$cli/completions" "$cli/man"
          target/release/hdrshot --generate bash > "$cli/completions/hdrshot.bash"
          target/release/hdrshot --generate zsh > "$cli/completions/_hdrshot"
          target/release/hdrshot --generate fish > "$cli/completions/hdrshot.fish"
          target/release/hdrshot --generate man > "$cli/man/hdrshot.1"
          cp target/release/hdrshot-gui README.md LICENSE packaging/linux/hdrshot.desktop "$gui/"
          cp crates/hdrshot-gui/assets/icon.png "$gui/hdrshot.png"
          cp -r packaging/linux/icons "$gui/"
          tar -czf "out/$cli.tar.gz" "$cli"
          tar -czf "out/$gui.tar.gz" "$gui"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  # On pull requests this job checks the combined downloads and stops before
  # publishing.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test "$(wc -l < SHA256SUMS.txt)" -eq 7
      - name: Release notes from CHANGELOG.md
        if: github.event_name != 'pull_request'
        run: |
          awk -v v="${TAG#v}" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $TAG"; exit 1; }
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: hdrshot ${{ env.TAG }}
          body_path: notes.md
          files: dist/*

  # crates.io Trusted Publishing: each crate lists this repository and
  # release.yml as a trusted publisher, so the job signs in with GitHub's
  # OIDC token. Crates are published in dependency order; a version that is
  # already on crates.io (the renderer, most releases) is skipped.
  crates-io:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for crate in hdrshot-core hdrshot-egui-backend hdrshot hdrshot-gui; do
            version=$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if curl -sf -A "hdrshot release (github.com/snaketech-tu/hdrshot)" \
                "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish --locked -p "$crate"
            fi
          done

  # Files a pull request to microsoft/winget-pkgs for both packages. Needs
  # the WINGET_TOKEN secret (a classic token with public_repo, from the
  # account that owns the winget-pkgs fork); skipped while it isn't set.
  winget:
    needs: release
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - identifier: SnakeTech.hdrshot
            installer: (^|/)hdrshot\.exe$
          - identifier: SnakeTech.hdrshot.CLI
            installer: hdrshot-cli\.exe$
    steps:
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: ${{ matrix.identifier }}
          installers-regex: ${{ matrix.installer }}
          release-tag: ${{ env.TAG }}
          token: ${{ env.WINGET_TOKEN }}
