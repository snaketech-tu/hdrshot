[workspace]
resolver = "3"
members = [
    "crates/hdrshot-core",
    "crates/hdrshot-cli",
    "crates/hdrshot-gui",
    "crates/egui-software-backend",
]

[workspace.package]
version = "2.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/hdrshot"
keywords = ["hdr", "jxr", "avif", "ultrahdr", "png"]
categories = ["multimedia::images", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1
