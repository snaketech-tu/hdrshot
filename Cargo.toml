[workspace]
resolver = "3"
members = [
    "crates/jxr2png-core",
    "crates/jxr2png-cli",
    "crates/jxr2png-gui",
    "crates/egui-software-backend",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/jxr2png"

[profile.release]
lto = "thin"
codegen-units = 1
