[workspace]
resolver = "3"
members = [
    "crates/hdrshot-core",
    "crates/hdrshot-cli",
    "crates/hdrshot-gui",
    "crates/hdrshot-web",
    "crates/egui-software-backend",
]

[workspace.package]
version = "2.2.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/snaketech-tu/hdrshot"
keywords = ["hdr", "jxr", "avif", "ultrahdr", "png"]
categories = ["multimedia::images", "command-line-utilities"]

[profile.release]
lto = "thin"
codegen-units = 1

# The AV1 decoder behind AVIF input is far too slow unoptimized or with its
# debug checks, even for the small test images.
[profile.dev.package.rav1d]
opt-level = 3
debug-assertions = false
overflow-checks = false
