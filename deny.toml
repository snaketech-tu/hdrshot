# cargo deny check: known vulnerabilities (RustSec), licenses and crate
# sources. Run by the lint job in ci.yml.

[graph]
all-features = false

[advisories]
# Unmaintained crates are reported only when hdrshot uses them directly.
unmaintained = "workspace"
ignore = []

[licenses]
# Permissive licenses only, so hdrshot stays Apache-2.0 compatible.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "MIT",
    "NCSA",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside the workspace carry versions for crates.io, so
# only unversioned ones would count; allow them for the unpublished web crate.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
